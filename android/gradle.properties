org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Keep the app's explicit arm64-v8a/x86_64 filter: Flutter 3.47 otherwise
# resets it to all default ABIs, including unsupported 32-bit armeabi-v7a.
disable-abi-filtering=true
# Pub plugins are on C: while this project is on D:; Kotlin incremental caches
# cannot relativize source paths across Windows drives.
kotlin.incremental=false

org.gradle.offline=true
